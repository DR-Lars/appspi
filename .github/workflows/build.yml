# Every push to main builds the image and pushes :latest and :<commit sha>.
#
# Check the repo's docker-compose file first:
#   build.context    -> "context" below
#   build.dockerfile -> "file" below
#   build.args       -> "build-args" below (values as GitHub secrets). This matters for
#                       SvelteKit apps that read env vars at BUILD time ($env/static/...).
name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # build-args: |
          #   PUBLIC_SOMETHING=${{ secrets.PUBLIC_SOMETHING }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
